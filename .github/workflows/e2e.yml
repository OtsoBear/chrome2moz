name: E2E Differential Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Install harness deps
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Cache CRX archives
        uses: actions/cache@v4
        with:
          path: e2e/.cache/crx
          key: crx-${{ hashFiles('e2e/corpus.json') }}

      - name: Unit tests
        working-directory: e2e
        run: pnpm test

      - name: Differential e2e
        working-directory: e2e
        run: xvfb-run --auto-servernum pnpm e2e

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/results/
